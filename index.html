<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satavue — Coming soon</title>
<meta name="description" content="Satavue, an AI native design studio. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #111111; --fg: #e4e1dc; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    min-height: 100svh;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  .brand, h1 { position: relative; z-index: 1; }
  .contact {
    position: fixed; z-index: 2; top: clamp(16px, 3vw, 32px); right: clamp(16px, 3vw, 40px);
    width: 44px; height: 44px; display: grid; place-items: center;
    color: var(--fg); border: 1px solid rgba(228,225,220,.3); border-radius: 50%;
    transition: border-color .2s, background .2s;
  }
  .contact:hover, .contact:focus-visible { border-color: var(--fg); background: rgba(228,225,220,.08); outline: none; }
  .contact svg { width: 18px; height: 18px; }
  .contact .tip {
    position: absolute; top: calc(100% + 10px); right: 0; white-space: nowrap;
    font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 6px;
    background: var(--fg); color: var(--bg);
    opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .contact:hover .tip, .contact:focus-visible .tip { opacity: 1; transform: none; }
  .brand {
    display: flex; align-items: center; gap: clamp(16px, 3.5vw, 28px);
    margin-bottom: clamp(16px, 3vw, 28px);
  }
  .name { font-weight: 600; font-size: clamp(22px, 3.6vw, 34px); letter-spacing: -0.03em; }
  .divider { width: 1.5px; height: clamp(30px, 5vw, 44px); background: var(--fg); opacity: .8; }
  .tag { font-weight: 500; font-size: clamp(13px, 2vw, 18px); line-height: 1.2; letter-spacing: -0.01em; }
  h1 {
    font-weight: 600; letter-spacing: -0.05em; line-height: .78;
    font-size: 18.6vw; white-space: nowrap;
    margin-bottom: -0.17em; /* crop descenders off the bottom edge like the reference */
  }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <a class="contact" href="mailto:sagorika@satavue.com" aria-label="Email sagorika@satavue.com">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
    <span class="tip">sagorika@satavue.com</span>
  </a>
  <div class="brand">
    <span class="name">Satavue</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="tag">AI native<br>design studio</span>
  </div>
  <h1>Coming soon</h1>
<script>
(() => {
  const c = document.getElementById('bg');
  const gl = c.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) return;
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = `precision mediump float;
uniform vec2 r; uniform float t; uniform vec2 m; uniform float e;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  vec2 mm=(m-.5)*vec2(r.x/r.y,1.);
  vec2 dm=uv-mm; float d=length(dm);
  // swirl the liquid around the cursor
  float sw=exp(-d*d*5.)*(.6+e*2.5);
  uv=mm+rot(sw)*dm;
  vec2 p=uv*1.4;
  float T=t*.12;
  // layered sine flow = smooth liquid
  for(int i=1;i<8;i++){
    float fi=float(i);
    p+=vec2(.55/fi*sin(fi*p.y+T+.3*fi),.45/fi*cos(fi*p.x+T*1.3+.5*fi));
  }
  float v=.5+.5*sin(p.x+p.y);
  float v2=.5+.5*cos(p.x*1.3-p.y*.7);
  // glossy highlight bands like liquid metal / ink
  float gloss=pow(1.-abs(v-v2),6.);
  vec3 col=vec3(.06);
  col+=vec3(.09,.088,.085)*v*v2;
  col+=vec3(.16,.155,.15)*gloss;
  col+=vec3(1.,.28,.08)*pow(v2,4.)*exp(-d*d*3.)*(.18+e*.8);
  col*=1.-.45*length(gl_FragCoord.xy/r-.5);
  gl_FragColor=vec4(col,1.);
}`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = k => gl.getUniformLocation(pr, k);
  const ur = U('r'), ut = U('t'), um = U('m'), ue = U('e');
  const target = { x: .5, y: .4 }, mouse = { x: .5, y: .4 }; let energy = 0, last = null;
  const move = (x, y) => {
    const nx = x / innerWidth, ny = 1 - y / innerHeight;
    if (last) energy = Math.min(1, energy + Math.hypot(nx - last.x, ny - last.y) * 4);
    last = { x: nx, y: ny }; target.x = nx; target.y = ny;
  };
  addEventListener('pointermove', e => move(e.clientX, e.clientY), { passive: true });
  addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    gl.viewport(0, 0, c.width, c.height);
  };
  addEventListener('resize', resize); resize();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frame = ms => {
    mouse.x += (target.x - mouse.x) * .06; mouse.y += (target.y - mouse.y) * .06;
    energy *= .96;
    gl.uniform2f(ur, c.width, c.height); gl.uniform1f(ut, ms / 1000);
    gl.uniform2f(um, mouse.x, mouse.y); gl.uniform1f(ue, energy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
